<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員中心｜GRAB A CUP</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="style.css"><style>
.member-wrap{max-width:1050px;margin:60px auto;padding:0 24px}.member-card{background:#fff;border:1px solid #eadfd6;border-radius:24px;padding:28px;margin-bottom:22px}.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.member-card input{width:100%;padding:13px;border:1px solid #ddd0c5;border-radius:12px;margin:6px 0 12px}.member-tabs{display:flex;gap:10px;margin-bottom:18px}.member-tabs button{padding:10px 18px;border:1px solid #ddd0c5;border-radius:999px;background:#fff;cursor:pointer}.member-link{display:inline-block;margin:2px 0 14px;padding:0;border:0;background:transparent;color:#7b3a22;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:800}.member-help{color:#76665d;font-size:14px;line-height:1.7}.member-order{border-top:1px solid #eee;padding:16px 0}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#f3e8da;margin:3px;font-size:12px}.hidden{display:none}@media(max-width:700px){.member-grid{grid-template-columns:1fr}}
</style><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html" aria-label="GRAB A CUP 首頁">GRAB A CUP<small>葛拉卡咖啡</small></a><button class="menu-toggle" aria-expanded="false" aria-label="開啟選單"><span></span><span></span><span></span></button><nav class="links" aria-label="主要導覽"><a href="product.html">產品介紹</a><a href="stores.html">門市查詢</a><a href="faq.html">常見問題</a><a href="contact.html">聯絡我們</a><a href="enterprise.html">企業專區</a><a href="shopping-guide.html">購物須知</a><a href="privacy.html">隱私權政策</a><a href="member.html">會員中心</a></nav></div></header>
<main class="member-wrap"><div class="eyebrow">MEMBER CENTER</div><h1>會員中心</h1><p>登入後可查詢歷史訂單、付款狀況與物流進度。</p>
<section id="auth" class="member-card"><div class="member-tabs"><button data-tab="login">會員登入</button><button data-tab="register">註冊會員</button></div>
<form id="login"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button type="button" class="member-link" id="openForgot">忘記密碼？</button><br><button class="btn">登入</button></form>
<form id="register" class="hidden"><div class="member-grid"><label>姓名<input name="name" required></label><label>手機<input name="phone"></label></div><label>Email<input name="email" type="email" autocomplete="email" required></label><label>密碼（至少 8 碼）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn">建立會員</button></form>
<form id="forgot" class="hidden"><h2>忘記密碼</h2><p class="member-help">輸入註冊 Email，我們會寄送一封有效期限 20 分鐘的一次性重設信。</p><label>註冊 Email<input name="email" type="email" autocomplete="email" required></label><button class="btn">寄送重設信</button> <button type="button" class="member-link" id="backLogin">返回登入</button></form>
<form id="reset" class="hidden"><h2>設定新密碼</h2><p class="member-help">請輸入至少 8 碼的新密碼。完成後，其他裝置上的舊登入會失效。</p><label>新密碼<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>再次輸入新密碼<input name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button class="btn">更新密碼</button></form><p id="authStatus" role="status" aria-live="polite"></p></section>
<section id="account" class="hidden"><div class="member-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="eyebrow">PROFILE</div><h2 id="memberName">會員資料</h2></div><button id="logout">登出</button></div><div id="memberTags"></div><form id="profile"><div class="member-grid"><label>姓名<input name="name"></label><label>手機<input name="phone"></label><label>公司名稱<input name="company"></label><label>統一編號<input name="taxId"></label></div><label>Email<input name="email" disabled></label><button class="btn">儲存資料</button></form></div>
<div class="member-card"><div class="eyebrow">MY ORDERS</div><h2>我的訂單</h2><div id="orders"></div></div></section></main>
<script>
const KEY='grabacup_member_token';let token=localStorage.getItem(KEY)||'';const $=s=>document.querySelector(s),money=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch('/api'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'操作失敗');return d}
const authForms=['login','register','forgot','reset'];function showAuth(name){authForms.forEach(id=>$('#'+id).classList.toggle('hidden',id!==name));$('#authStatus').textContent=''}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showAuth(b.dataset.tab));
$('#openForgot').onclick=()=>{showAuth('forgot');$('#forgot').querySelector('[name=email]').value=$('#login').querySelector('[name=email]').value};$('#backLogin').onclick=()=>showAuth('login');
async function submitAuth(e,path){e.preventDefault();try{const d=await api(path,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.setItem(KEY,token);await load()}catch(x){$('#authStatus').textContent=x.message}}
$('#login').onsubmit=e=>submitAuth(e,'/member/login');$('#register').onsubmit=e=>submitAuth(e,'/member/register');
$('#forgot').onsubmit=async e=>{e.preventDefault();const button=e.submitter||e.target.querySelector('.btn');button.disabled=true;$('#authStatus').textContent='寄送中…';try{const d=await api('/member/forgot-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#authStatus').textContent=d.message;e.target.reset()}catch(x){$('#authStatus').textContent=x.message}finally{button.disabled=false}};
$('#reset').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirmPassword')||'');if(password!==confirmPassword){$('#authStatus').textContent='兩次輸入的密碼不一致';return}const button=e.submitter||e.target.querySelector('.btn');button.disabled=true;try{const d=await api('/member/reset-password',{method:'POST',body:JSON.stringify({token:resetToken,password})});showAuth('login');$('#authStatus').textContent=d.message;e.target.reset()}catch(x){$('#authStatus').textContent=x.message}finally{button.disabled=false}};
async function load(){if(!token)return;try{const d=await api('/member/me');$('#auth').classList.add('hidden');$('#account').classList.remove('hidden');const m=d.member;$('#memberName').textContent=m.name||m.email;const f=$('#profile');f.name.value=m.name||'';f.phone.value=m.phone||'';f.company.value=m.company||'';f.taxId.value=m.tax_id||'';f.email.value=m.email;$('#memberTags').innerHTML=(m.tags||[]).map(t=>'<span class="tag">'+t.name+'</span>').join('');$('#orders').innerHTML=(d.orders||[]).length?(d.orders||[]).map(o=>'<article class="member-order"><b>'+o.order_no+'</b> · '+money(o.total)+'<br><span>付款：'+o.payment_status+'　訂單：'+o.fulfillment_status+'　物流：'+(o.shipment?.status||'pending')+'</span>'+(o.shipment?.tracking_no?'<br><span>物流單號：'+o.shipment.tracking_no+'</span>':'')+'</article>').join(''):'目前沒有訂單紀錄。'}catch(e){localStorage.removeItem(KEY);token=''}}
$('#profile').onsubmit=async e=>{e.preventDefault();try{await api('/member/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('會員資料已更新')}catch(x){alert(x.message)}};
$('#logout').onclick=()=>{localStorage.removeItem(KEY);location.reload()};const resetToken=new URLSearchParams(location.search).get('reset')||'';if(resetToken){history.replaceState({},'',location.pathname);localStorage.removeItem(KEY);token='';showAuth('reset')}load();
</script><script src="script.js"></script></body></html>
